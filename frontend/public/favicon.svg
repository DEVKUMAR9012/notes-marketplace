<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    
    <linearGradient id="brandTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Piche wale Teal card ka smooth floating flow */
      @keyframes floatBack {
        0%, 100% { transform: translate(130px, 220px) rotate(-22deg); }
        50% { transform: translate(130px, 208px) rotate(-19deg); }
      }
      
      /* Aage wale Violet card ka smooth floating flow (thoda alag timing par) */
      @keyframes floatFront {
        0%, 100% { transform: translate(190px, 160px) rotate(-35deg); }
        50% { transform: translate(190px, 146px) rotate(-38deg); }
      }

      .animated-back {
        animation: floatBack 6s ease-in-out infinite;
      }
      
      .animated-front {
        animation: floatFront 4.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="512" height="512" rx="128" fill="#08080E" />

  <g filter="url(#glow)">
    <g class="animated-back">
      <rect x="0" y="0" width="180" height="230" rx="36" fill="url(#brandTeal)" />
      <line x1="40" y1="70" x2="110" y2="70" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.8" />
      <line x1="40" y1="120" x2="90" y2="120" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.8" />
    </g>

    <g class="animated-front">
      <rect x="-5" y="5" width="190" height="240" rx="36" fill="#050508" opacity="0.5" filter="blur(8px)" />
      <rect x="0" y="0" width="190" height="240" rx="36" fill="url(#brandViolet)" />
      <line x1="45" y1="90" x2="145" y2="90" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
      <line x1="45" y1="140" x2="120" y2="140" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    </g>
  </g>
</svg>
